# Garry's Mod: Valve's physics sandbox, its dedicated server from Steam, on its
# 64-bit branch.
id = "gmod"
name = "Garry's Mod"
description = "The physics sandbox: build, or play its gamemodes (Trouble in Terrorist Town). The dedicated server comes from Steam (about 7 GB)."
badge = "🧰"
memory = { min_mb = 1024, default_mb = 2048 }
ports = [
  { name = "game", protocol = "udp", label = "Game" },
  { name = "client", protocol = "udp", label = "Client (outgoing)" },
]
install = { kind = "steamcmd", app_id = 4020, beta = "x86-64" }
connect = "connect {host}:{port.game}"

# Addons one uploads (.gma); most come from a Workshop collection instead.
[addons]
label = "Addons"
dir = "garrysmod/addons"
extensions = ["gma"]
help = "Addon files (.gma), loaded at the next start. Content from the Steam Workshop is easier as a collection: set its number in Settings, and players download it as they join."

[run]
# srcds_run restarts the server when it crashes, unless -norestart: archipel does.
command = [
  "./srcds_run_x64",
  "-game", "garrysmod",
  "-console",
  "-norestart",
  "-strictportbind",
  "-port", "{port.game}",
  "+clientport", "{port.client}",
  "+gamemode", "{setting.gamemode}",
  "+host_workshop_collection", "{setting.workshop}",
  "+maxplayers", "{setting.max_players}",
  "+map", "{setting.map}",
  "+sv_setsteamaccount", "{setting.token}",
  "+servercfgfile", "archipel.cfg",
]
stop_command = "quit"
stop_timeout_secs = 20
ready = "Connection to Steam servers successful"

[[settings]]
key = "hostname"
label = "Server name"
type = "text"
default = "An archipel server"
max_len = 64

[[settings]]
key = "max_players"
label = "Players"
type = "number"
default = 16
min = 2
max = 128

[[settings]]
key = "password"
label = "Password to join"
help = "Empty: anyone can join."
type = "secret"

[[settings]]
key = "token"
label = "Steam game server token"
help = "Optional. Steam lists servers that have one higher; make one for app 4000 on the page linked."
link = "https://steamcommunity.com/dev/managegameservers"
type = "secret"

[[settings]]
key = "gamemode"
label = "Gamemode"
help = "sandbox or terrortown (Trouble in Terrorist Town) come with the game; others come from the Workshop collection, by their folder name."
type = "text"
default = "sandbox"
max_len = 64
required = true

[[settings]]
key = "map"
label = "First map"
help = "gm_construct or gm_flatgrass come with the game; others come from the Workshop collection."
type = "text"
default = "gm_construct"
max_len = 64
required = true

[[settings]]
key = "workshop"
label = "Workshop collection"
help = "The number at the end of a Steam Workshop collection's address (…?id=123456789): its addons, maps and gamemodes are downloaded at start. Empty: none."
type = "text"
default = ""
max_len = 20

[[files]]
path = "garrysmod/cfg/archipel.cfg"
format = "text"
content = """
// Written by archipel at each start, from the server's settings, and run at
// every map change. Your own settings go in server.cfg, read first.
sv_allowdownload 1
net_maxfilesize 64
exec server.cfg
hostname "{setting.hostname}"
sv_password "{setting.password}"
"""

[[files]]
path = "garrysmod/cfg/server.cfg"
label = "Your settings (server.cfg)"
format = "text"
editable = true
initial = """
// Your server's own settings, run at every map change before the ones from
// its settings page.
sbox_maxprops 150\nsbox_noclip 1\nsv_allowcslua 0\n"""

# Typed into the server's console, without a slash.
[[commands]]
name = "gamemode"
args = "<name>"
help = "Gamemode from the next map: gamemode terrortown"

[[commands]]
name = "lua_run"
args = "<code>"
help = "Run Lua on the server"

[[commands]]
name = "sbox_maxprops"
args = "<count>"
help = "Props each player may spawn"

[[commands]]
name = "status"
help = "Who is connected, with their user ids"

[[commands]]
name = "changelevel"
args = "<map>"
help = "Change the map now"

[[commands]]
name = "say"
args = "<message>"
help = "Talk to every player"

[[commands]]
name = "kick"
args = "<name>"
help = "Throw a player out"

[[commands]]
name = "kickid"
args = "<userid> [reason]"
help = "Throw a player out by the id status shows"

[[commands]]
name = "banid"
args = "<minutes> <userid> kick"
help = "Ban a player (0 minutes: for good) and throw them out"

[[commands]]
name = "writeid"
help = "Save the bans made with banid"

[[commands]]
name = "mp_timelimit"
args = "<minutes>"
help = "Time limit of each map"

[[commands]]
name = "mp_restartgame"
args = "<seconds>"
help = "Restart the game after that many seconds"

[[commands]]
name = "sv_password"
args = "<password>"
help = "Password to join; \"\" for none"

[[commands]]
name = "exec"
args = "<file.cfg>"
help = "Run a configuration file of the cfg folder"

[[commands]]
name = "stats"
help = "How busy the server is"

[[commands]]
name = "quit"
help = "Stop the server"
