# Garry's Mod: Valve's physics sandbox, its dedicated server from Steam, on its
# 64-bit branch.
id = "gmod"
name = "Garry's Mod"
description = "The physics sandbox: build, or play Trouble in Terrorist Town, Murder or Prop Hunt with their maps, and anything from the Steam Workshop. The dedicated server comes from Steam (about 7 GB)."
badge = "🧰"
memory = { min_mb = 1024, default_mb = 2048 }
ports = [
  { name = "game", protocol = "udp", label = "Game" },
  { name = "client", protocol = "udp", label = "Client (outgoing)" },
]
install = { kind = "steamcmd", app_id = 4020, beta = "x86-64" }
connect = "connect {host}:{port.game}"

# Addons one uploads (.gma); most come from the Workshop tab instead.
[addons]
label = "Addons"
dir = "garrysmod/addons"
extensions = ["gma"]
help = "Addon files (.gma) of your own, loaded at the next start. Anything on the Steam Workshop is easier from the Workshop tab, and players get it from Steam."

[run]
# srcds_run restarts the server when it crashes, unless -norestart: archipel does.
# tty: srcds holds its console in a buffer when it writes to a pipe, so the
# ready line below would stay there and the server look stuck starting while it
# already runs. (stdbuf cannot help the 32-bit ones: its library is 64-bit.)
command = [
  "./srcds_run_x64",
  "-game", "garrysmod",
  "-console",
  "-norestart",
  "-strictportbind",
  "-port", "{port.game}",
  "+clientport", "{port.client}",
  "+gamemode", "{setting.gamemode}",
  "+maxplayers", "{setting.max_players}",
  "+map", "{setting.map}",
  "+sv_setsteamaccount", "{setting.token}",
  "+servercfgfile", "archipel.cfg",
]
stop_command = "quit"
stop_timeout_secs = 20
ready = "Connection to Steam servers successful"
tty = true

[[settings]]
key = "gamemode"
label = "Gamemode"
help = "archipel brings what the ones listed need from the Workshop (Workshop tab). Gamemodes found in your own Workshop items are listed after them, once the server has started with them."
type = "choice"
default = "sandbox"
options_from = "workshop_gamemodes"
options = [
  { value = "sandbox", label = "Sandbox" },
  { value = "terrortown", label = "Trouble in Terrorist Town" },
  { value = "murder", label = "Murder" },
  { value = "prop_hunt", label = "Prop Hunt" },
]

[[settings]]
key = "map"
label = "First map"
help = "The gamemode's maps, then those found in your Workshop items. The next ones come in turn, or by vote."
type = "choice"
default = "gm_construct"
options_from = "workshop_maps"
options = [
  { value = "gm_construct", label = "Construct (gm_construct)" },
  { value = "gm_flatgrass", label = "Flatgrass (gm_flatgrass)" },
]

[[settings]]
key = "hostname"
label = "Server name"
type = "text"
default = "An archipel server"
max_len = 64

[[settings]]
key = "max_players"
label = "Players"
type = "number"
default = 16
min = 2
max = 128

[[settings]]
key = "password"
label = "Password to join"
help = "Empty: anyone can join."
type = "secret"

[[settings]]
key = "token"
label = "Steam game server token"
help = "Optional. Steam lists servers that have one higher; make one for app 4000 on the page linked."
link = "https://steamcommunity.com/dev/managegameservers"
type = "secret"

# The Workshop items the server downloads at start: its gamemode's, picked to
# work without Counter-Strike: Source and to download fast, then its owner's.
[workshop]
app_id = 4000
ids_file = "garrysmod/cfg/srcds_workshop_ids.txt"
cache_dirs = ["garrysmod/cache/srcds", "steam_cache"]
lua_file = "garrysmod/lua/autorun/server/archipel_workshop.lua"
gamemode_setting = "gamemode"
map_setting = "map"

[[workshop.presets]]
gamemode = "terrortown"
# MapVote: players vote for the next map when the map's rounds are over.
items = ["151583504"]
map_prefixes = ["ttt_"]
config = """
ttt_round_limit 6
ttt_time_limit_minutes 60
"""
maps = [
  { id = "159321088", map = "ttt_minecraft_b5", label = "Minecraft", mb = 4 },
  { id = "157420728", map = "ttt_waterworld", label = "Waterworld", mb = 12 },
  { id = "106498411", map = "ttt_mc_skyislands", label = "Sky Islands", mb = 14 },
  { id = "281454209", map = "ttt_clue_se", label = "Clue", mb = 25 },
  { id = "295897079", map = "ttt_lego", label = "Lego", mb = 8 },
  { id = "183797802", map = "ttt_island_2013", label = "Island", mb = 3 },
  { id = "389346280", map = "ttt_minecraft_haven", label = "Minecraft Haven", mb = 3 },
  { id = "133911194", map = "ttt_theship_v1", label = "The Ship", mb = 50 },
]

[[workshop.presets]]
gamemode = "murder"
# Murder, by Mechanical Mind.
items = ["187073946"]
map_prefixes = ["mu_", "md_", "murder_"]
map_list_file = "garrysmod/data/murder/maplist.txt"
config = """
mu_roundlimit 5
"""
maps = [
  { id = "262374517", map = "mu_abandoned", label = "Abandoned", mb = 1 },
  { id = "268941847", map = "ph_abandoned_office", label = "Abandoned office", mb = 1 },
  { id = "159321088", map = "ttt_minecraft_b5", label = "Minecraft", mb = 4 },
  { id = "225468579", map = "mu_nightmare_church", label = "Nightmare church", mb = 91 },
]

[[workshop.presets]]
gamemode = "prop_hunt"
# Prop Hunt: Enhanced, the maintained Prop Hunt, and ULib and ULX, which its map
# vote needs (ULX also gives the server's admins their commands).
items = ["1758906555", "557962238", "557962280"]
map_prefixes = ["ph_"]
maps = [
  { id = "184894018", map = "gm_wwhouse", label = "Walter White's house", mb = 2 },
  { id = "177889282", map = "ph_warehouse_v2", label = "Warehouse", mb = 1 },
  { id = "171019775", map = "ph_niteoflivingdead", label = "Night of the Living Dead", mb = 1 },
  { id = "181276343", map = "ph_building_a3", label = "Building", mb = 1 },
  { id = "185868094", map = "ph_house_a1", label = "House", mb = 1 },
  { id = "184568395", map = "ph_wasteland", label = "Wasteland", mb = 1 },
  { id = "375116509", map = "ph_fancyhouse", label = "Fancy house", mb = 30 },
]

[[files]]
path = "garrysmod/cfg/archipel.cfg"
format = "text"
content = """
// Written by archipel at each start, from the server's settings, and run at
// every map change. Your own settings go in server.cfg, read after the
// gamemode's.
sv_allowdownload 1
net_maxfilesize 64
{workshop.config}
exec server.cfg
hostname "{setting.hostname}"
sv_password "{setting.password}"
"""

[[files]]
path = "garrysmod/cfg/server.cfg"
label = "Your settings (server.cfg)"
format = "text"
editable = true
initial = """
// Your server's own settings, run at every map change after the gamemode's
// and before the ones from its settings page.
sbox_maxprops 150
sbox_noclip 1
sv_allowcslua 0
"""

# Typed into the server's console, without a slash.
[[commands]]
name = "gamemode"
args = "<name>"
help = "Gamemode from the next map: gamemode terrortown"

[[commands]]
name = "lua_run"
args = "<code>"
help = "Run Lua on the server"

[[commands]]
name = "sbox_maxprops"
args = "<count>"
help = "Props each player may spawn"

[[commands]]
name = "status"
help = "Who is connected, with their user ids"

[[commands]]
name = "changelevel"
args = "<map>"
help = "Change the map now"

[[commands]]
name = "say"
args = "<message>"
help = "Talk to every player"

[[commands]]
name = "kick"
args = "<name>"
help = "Throw a player out"

[[commands]]
name = "kickid"
args = "<userid> [reason]"
help = "Throw a player out by the id status shows"

[[commands]]
name = "banid"
args = "<minutes> <userid> kick"
help = "Ban a player (0 minutes: for good) and throw them out"

[[commands]]
name = "writeid"
help = "Save the bans made with banid"

[[commands]]
name = "mp_timelimit"
args = "<minutes>"
help = "Time limit of each map"

[[commands]]
name = "mp_restartgame"
args = "<seconds>"
help = "Restart the game after that many seconds"

[[commands]]
name = "sv_password"
args = "<password>"
help = "Password to join; \"\" for none"

[[commands]]
name = "exec"
args = "<file.cfg>"
help = "Run a configuration file of the cfg folder"

[[commands]]
name = "stats"
help = "How busy the server is"

[[commands]]
name = "quit"
help = "Stop the server"
