# Puck: physics-based online hockey, its dedicated server from Steam.
id = "puck"
name = "Puck"
description = "Physics-based online hockey. The dedicated server comes from Steam."
badge = "🏒"
memory = { min_mb = 1024, default_mb = 1536 }
# One port, for UDP and TCP alike.
ports = [{ name = "game", protocol = "udp", label = "Game" }]
install = { kind = "steamcmd", app_id = 3481440 }
connect = "{host}:{port.game}"

[run]
# The Linux server is a Unity player, run without a screen.
command = ["./Puck", "-batchmode", "-nographics"]
env = { LD_LIBRARY_PATH = "{dir}" }
stop_signal = "SIGINT"
stop_timeout_secs = 20
ready = "is ready to accept clients"

[[settings]]
key = "name"
label = "Server name"
type = "text"
default = "An archipel server"
max_len = 64

[[settings]]
key = "max_players"
label = "Players"
type = "number"
default = 12
min = 2
max = 32

[[settings]]
key = "password"
label = "Password to join"
help = "Empty: anyone can join."
type = "secret"

[[settings]]
key = "public"
label = "Listed on the public server list"
type = "toggle"
default = true

[[settings]]
key = "voip"
label = "Voice chat"
type = "toggle"
default = false

[[settings]]
key = "whitelist"
label = "Only whitelisted players can join"
help = "Their Steam IDs go in whitelisted_steam_ids.json."
type = "toggle"
default = false

[[files]]
path = "server_config.json"
label = "Server configuration"
format = "json"
editable = true
set = { port = "{port.game}", name = "{setting.name}", maxPlayers = "{setting.max_players}", password = "{setting.password}", isPublic = "{setting.public}", useVoip = "{setting.voip}", useWhitelist = "{setting.whitelist}" }
initial = """
{
  "port": 7777,
  "name": "An archipel server",
  "maxPlayers": 12,
  "password": null,
  "tickRate": 200,
  "isPublic": true,
  "useVoip": false,
  "useWhitelist": false,
  "mods": [],
  "gameMode": "public",
  "level": "default"
}
"""

[[files]]
path = "public_game_mode_config.json"
label = "Game mode (public): phase durations"
format = "json"
editable = true
