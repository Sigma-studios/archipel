# Team Fortress 2: Valve's class-based team shooter, its dedicated server from
# Steam (64-bit).
id = "tf2"
name = "Team Fortress 2"
description = "Valve's class-based team shooter. The dedicated server comes from Steam: a big download (about 12 GB)."
badge = "🔧"
memory = { min_mb = 1024, default_mb = 1536 }
ports = [
  { name = "game", protocol = "udp", label = "Game" },
  { name = "client", protocol = "udp", label = "Client (outgoing)" },
]
install = { kind = "steamcmd", app_id = 232250 }
connect = "connect {host}:{port.game}"

# Maps of one's own: .bsp files in tf/maps, next to the game's.
[addons]
label = "Maps"
dir = "tf/maps"
extensions = ["bsp"]
help = "The game's maps are here too. Add your own .bsp files: they can be picked as the first map, or changed to with changelevel. Players who lack one download it from the server as they join (64 MB at most)."

[run]
# srcds_run restarts the server when it crashes, unless -norestart: archipel does.
command = [
  "./srcds_run_64",
  "-game", "tf",
  "-console",
  "-norestart",
  "-strictportbind",
  "-port", "{port.game}",
  "+clientport", "{port.client}",
  "+maxplayers", "{setting.max_players}",
  "+map", "{setting.map}",
  "+sv_setsteamaccount", "{setting.token}",
  "+servercfgfile", "archipel.cfg",
]
stop_command = "quit"
stop_timeout_secs = 20
ready = "Connection to Steam servers successful"

[[settings]]
key = "hostname"
label = "Server name"
type = "text"
default = "An archipel server"
max_len = 64

[[settings]]
key = "max_players"
label = "Players"
type = "number"
default = 24
min = 2
max = 32

[[settings]]
key = "password"
label = "Password to join"
help = "Empty: anyone can join."
type = "secret"

[[settings]]
key = "token"
label = "Steam game server token"
help = "Optional. Steam lists servers that have one higher; make one for app 440 on the page linked."
link = "https://steamcommunity.com/dev/managegameservers"
type = "secret"

[[settings]]
key = "map"
label = "First map"
help = "The next ones come from the map cycle (Files tab). Maps added in the Maps tab are listed after the game's own."
type = "choice"
default = "ctf_2fort"
options_from = "maps"
options = [
  { value = "ctf_2fort", label = "2Fort (capture the flag)" },
  { value = "cp_5gorge", label = "5Gorge (control points)" },
  { value = "cp_badlands", label = "Badlands (control points)" },
  { value = "koth_badlands", label = "Badlands (king of the hill)" },
  { value = "pl_badwater", label = "Badwater Basin (payload)" },
  { value = "pl_barnblitz", label = "Barnblitz (payload)" },
  { value = "cp_coldfront", label = "Coldfront (control points)" },
  { value = "cp_degrootkeep", label = "DeGroot Keep (control points)" },
  { value = "sd_doomsday", label = "Doomsday (special delivery)" },
  { value = "ctf_doublecross", label = "Double Cross (capture the flag)" },
  { value = "cp_dustbowl", label = "Dustbowl (control points)" },
  { value = "cp_egypt_final", label = "Egypt (control points)" },
  { value = "cp_fastlane", label = "Fastlane (control points)" },
  { value = "cp_foundry", label = "Foundry (control points)" },
  { value = "cp_freight_final1", label = "Freight (control points)" },
  { value = "pl_frontier_final", label = "Frontier (payload)" },
  { value = "pl_goldrush", label = "Gold Rush (payload)" },
  { value = "cp_gorge", label = "Gorge (control points)" },
  { value = "cp_granary", label = "Granary (control points)" },
  { value = "cp_gravelpit", label = "Gravel Pit (control points)" },
  { value = "cp_gullywash_final1", label = "Gullywash (control points)" },
  { value = "koth_harvest_final", label = "Harvest (king of the hill)" },
  { value = "plr_hightower", label = "Hightower (payload race)" },
  { value = "pl_hoodoo_final", label = "Hoodoo (payload)" },
  { value = "tc_hydro", label = "Hydro (territorial control)" },
  { value = "cp_junction_final", label = "Junction (control points)" },
  { value = "koth_king", label = "King (king of the hill)" },
  { value = "koth_lakeside_final", label = "Lakeside (king of the hill)" },
  { value = "cp_metalworks", label = "Metalworks (control points)" },
  { value = "cp_mountainlab", label = "Mountain Lab (control points)" },
  { value = "plr_nightfall_final", label = "Nightfall (payload race)" },
  { value = "koth_nucleus", label = "Nucleus (king of the hill)" },
  { value = "plr_pipeline", label = "Pipeline (payload race)" },
  { value = "cp_process_final", label = "Process (control points)" },
  { value = "ctf_sawmill", label = "Sawmill (capture the flag)" },
  { value = "koth_sawmill", label = "Sawmill (king of the hill)" },
  { value = "cp_snakewater_final1", label = "Snakewater (control points)" },
  { value = "cp_standin_final", label = "Standin (control points)" },
  { value = "cp_steel", label = "Steel (control points)" },
  { value = "cp_sunshine", label = "Sunshine (control points)" },
  { value = "pl_swiftwater_final1", label = "Swiftwater (payload)" },
  { value = "pl_thundermountain", label = "Thunder Mountain (payload)" },
  { value = "ctf_turbine", label = "Turbine (capture the flag)" },
