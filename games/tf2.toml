[[files]]
path = "tf/cfg/archipel.cfg"
format = "text"
content = """
// Written by archipel at each start, from the server's settings, and run at
// every map change. Your own settings go in server.cfg, read first.
sv_allowdownload 1
net_maxfilesize 64
exec server.cfg
hostname "{setting.hostname}"
sv_password "{setting.password}"
"""

[[files]]
path = "tf/cfg/server.cfg"
label = "Your settings (server.cfg)"
format = "text"
editable = true
initial = """
// Your server's own settings, run at every map change before the ones from
// its settings page.
mp_timelimit 30\nmp_autoteambalance 1\nsv_alltalk 0\ntf_bot_quota 0\n"""

[[files]]
path = "tf/cfg/mapcycle.txt"
label = "Map cycle"
format = "text"
editable = true
initial = """
ctf_2fort
cp_badlands
cp_dustbowl
cp_granary
cp_gravelpit
cp_well
tc_hydro
ctf_well
pl_goldrush
cp_fastlane
ctf_turbine
pl_badwater
cp_steel
cp_egypt_final
cp_junction_final
plr_pipeline
"""

# Typed into the server's console, without a slash.
[[commands]]
name = "tf_bot_add"
args = "[count] [class] [red|blue] [easy|normal|hard|expert]"
help = "Add bots: tf_bot_add 4"

[[commands]]
name = "tf_bot_kick"
args = "all"
help = "Remove the bots"

[[commands]]
name = "tf_bot_quota"
args = "<count>"
help = "Keep that many players, bots filling in"

[[commands]]
name = "mp_scrambleteams"
help = "Mix the teams up"

[[commands]]
name = "status"
help = "Who is connected, with their user ids"

[[commands]]
name = "changelevel"
args = "<map>"
help = "Change the map now"

[[commands]]
name = "say"
args = "<message>"
help = "Talk to every player"

[[commands]]
name = "kick"
args = "<name>"
help = "Throw a player out"

[[commands]]
name = "kickid"
args = "<userid> [reason]"
help = "Throw a player out by the id status shows"

[[commands]]
name = "banid"
args = "<minutes> <userid> kick"
help = "Ban a player (0 minutes: for good) and throw them out"

[[commands]]
name = "writeid"
help = "Save the bans made with banid"

[[commands]]
name = "mp_timelimit"
args = "<minutes>"
help = "Time limit of each map"

[[commands]]
name = "mp_restartgame"
args = "<seconds>"
help = "Restart the game after that many seconds"

[[commands]]
name = "sv_password"
args = "<password>"
help = "Password to join; \"\" for none"

[[commands]]
name = "exec"
args = "<file.cfg>"
help = "Run a configuration file of the cfg folder"

[[commands]]
name = "stats"
help = "How busy the server is"

[[commands]]
name = "quit"
help = "Stop the server"
