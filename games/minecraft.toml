# Minecraft: Java Edition, vanilla or Paper (plugins).
id = "minecraft"
name = "Minecraft"
description = "Java Edition. Vanilla, or Paper to run plugins."
badge = "⛏️"
memory = { min_mb = 1024, default_mb = 2048 }
ports = [{ name = "game", protocol = "tcp", label = "Game" }]
install = { kind = "minecraft" }
connect = "{host}:{port.game}"

[run]
command = [
  "{java}", "-Xms{java_memory_mb}M", "-Xmx{java_memory_mb}M",
  "-XX:+UseG1GC", "-XX:+ParallelRefProcEnabled",
  # A plain console: no prompt nor colours in the web console.
  "-Dterminal.jline=false", "-Dterminal.ansi=false",
  "-jar", "server.jar", "nogui",
]
stop_command = "stop"
stop_timeout_secs = 90
ready = "Done ("

# Paper loads the plugins in plugins/ at start.
[addons]
label = "Plugins"
dir = "plugins"
extensions = ["jar"]
when = { flavor = "paper" }
search = "modrinth"
help = "Plugins load when the server starts, so restart it after adding or removing one. Most keep their settings in a folder of their own next to them, created at their first start."

[backup]
before = ["save-off", "save-all flush"]
wait_for = "Saved the game"
after = ["save-on"]

[[settings]]
key = "eula"
label = "I accept the Minecraft EULA"
help = "Mojang requires every server's owner to accept it."
link = "https://aka.ms/MinecraftEULA"
type = "toggle"
required = true

[[settings]]
key = "flavor"
label = "Server"
type = "choice"
default = "paper"
reinstall = true
options = [
  { value = "paper", label = "Paper (faster, runs plugins)" },
  { value = "vanilla", label = "Vanilla (Mojang's own)" },
]

[[settings]]
key = "version"
label = "Version"
help = "Players need the same one. Latest follows new releases when the server is reinstalled."
type = "choice"
default = "latest"
options = [{ value = "latest", label = "Latest release" }]
options_from = "minecraft_versions"
reinstall = true

[[settings]]
key = "motd"
label = "Message of the day"
help = "Shown under the server's name in the server list."
type = "text"
default = "A Minecraft server on archipel"
max_len = 120

[[settings]]
key = "max_players"
label = "Players"
type = "number"
default = 10
min = 1
max = 200

[[settings]]
key = "gamemode"
label = "Game mode"
type = "choice"
default = "survival"
options = [
  { value = "survival", label = "Survival" },
  { value = "creative", label = "Creative" },
  { value = "adventure", label = "Adventure" },
  { value = "spectator", label = "Spectator" },
]

[[settings]]
key = "difficulty"
label = "Difficulty"
type = "choice"
default = "normal"
options = [
  { value = "peaceful", label = "Peaceful" },
  { value = "easy", label = "Easy" },
  { value = "normal", label = "Normal" },
  { value = "hard", label = "Hard" },
]

[[settings]]
key = "pvp"
label = "Players can hurt each other"
type = "toggle"
default = true

[[settings]]
key = "whitelist"
label = "Only players on the whitelist can join"
help = "Add them from the console: whitelist add <name>."
type = "toggle"
default = false

[[settings]]
key = "online_mode"
label = "Check players' accounts with Mojang"
help = "Leave it on: off lets anyone join under any name."
type = "toggle"
default = true

[[settings]]
key = "view_distance"
label = "View distance (chunks)"
type = "number"
default = 10
min = 3
max = 32

[[settings]]
key = "seed"
label = "World seed"
help = "Used when the world is created; empty for a random one."
type = "text"
default = ""
max_len = 64

[[files]]
path = "eula.txt"
format = "text"
content = "eula={setting.eula}\n"

[[files]]
path = "server.properties"
label = "Server properties"
format = "properties"
editable = true
set = { "server-port" = "{port.game}", "query.port" = "{port.game}", "motd" = "{setting.motd}", "max-players" = "{setting.max_players}", "gamemode" = "{setting.gamemode}", "difficulty" = "{setting.difficulty}", "pvp" = "{setting.pvp}", "white-list" = "{setting.whitelist}", "enforce-whitelist" = "{setting.whitelist}", "online-mode" = "{setting.online_mode}", "view-distance" = "{setting.view_distance}", "level-seed" = "{setting.seed}", "enable-rcon" = "false" }

# Typed into the server's console, without the slash used in the game's chat.
[[commands]]
name = "help"
help = "Every command, or help on one"

[[commands]]
name = "list"
help = "Who is online"

[[commands]]
name = "say"
args = "<message>"
help = "Talk to every player"

[[commands]]
name = "op"
args = "<player>"
help = "Give a player every power, commands included"

[[commands]]
name = "deop"
args = "<player>"
help = "Take them back"

[[commands]]
name = "whitelist add"
args = "<player>"
help = "Let a player join when the whitelist is on"

[[commands]]
name = "whitelist remove"
args = "<player>"
help = "Take them off the whitelist"

[[commands]]
name = "whitelist list"
help = "Who is on the whitelist"

[[commands]]
name = "whitelist on"
help = "Only players on the whitelist can join"

[[commands]]
name = "whitelist off"
help = "Anyone can join"

[[commands]]
name = "kick"
args = "<player> [reason]"
help = "Throw a player out"

[[commands]]
name = "ban"
args = "<player> [reason]"
help = "Ban a player"

[[commands]]
name = "pardon"
args = "<player>"
help = "Lift a ban"

[[commands]]
name = "banlist"
help = "Who is banned"

[[commands]]
name = "gamemode"
args = "<survival|creative|adventure|spectator> [player]"
help = "Change a player's game mode"

[[commands]]
name = "difficulty"
args = "<peaceful|easy|normal|hard>"
help = "Change the difficulty"

[[commands]]
name = "time set"
args = "<day|night|noon|midnight>"
help = "Change the time of day"

[[commands]]
name = "weather"
args = "<clear|rain|thunder>"
help = "Change the weather"

[[commands]]
name = "tp"
args = "<player> <target player>"
help = "Teleport a player to another"

[[commands]]
name = "give"
args = "<player> <item> [count]"
help = "Give a player items: give Steve diamond 5"

[[commands]]
name = "gamerule"
args = "<rule> [value]"
help = "Change a game rule: gamerule keepInventory true"

[[commands]]
name = "setworldspawn"
args = "[x y z]"
help = "Move the world's spawn point"

[[commands]]
name = "seed"
help = "The world's seed"

[[commands]]
name = "save-all"
help = "Save the world now"

[[commands]]
name = "plugins"
help = "The plugins loaded (Paper)"

[[commands]]
name = "tps"
help = "How fast the server keeps up (Paper; 20 is full speed)"

[[commands]]
name = "version"
help = "The server's version"

[[commands]]
name = "stop"
help = "Save the world and stop the server"
