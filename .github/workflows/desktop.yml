# The desktop app for Linux: a .deb and an AppImage, for x86_64 and arm64. Built on
# every push to main (downloadable from the run), attached to the release on a tag.
name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu: the AppImage runs on systems as recent or more.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: Web UI
        working-directory: crates/archipel-ui
        run: trunk build --release
      - name: Tests
        run: cargo test -p archipel -p archipel-core
      - name: Bundles
        working-directory: crates/archipel-desktop
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: archipel-desktop-${{ runner.arch }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
