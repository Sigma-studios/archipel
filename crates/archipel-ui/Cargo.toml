[package]
name = "archipel-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
archipel-core = { path = "../archipel-core" }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-streams = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Storage", "Window", "Location", "AbortController", "AbortSignal", "Clipboard", "Navigator", "ReadableStream", "Response", "RequestInit", "Headers", "Element", "HtmlElement", "HtmlInputElement", "ScrollIntoViewOptions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
futures-util = "0.3"
